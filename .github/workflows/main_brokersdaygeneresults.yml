# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy SAM gene results

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: brokersdaygeneresults-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production server
        run: npm run build

      - name: Verify standalone bundle
        run: |
          test -f dist/standalone/server.js
          test -f dist/standalone/package.json
          test -d dist/standalone/dist
          test -d dist/standalone/node_modules
          test -d dist/standalone/public

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist/standalone
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_498271EC30FD4E5EBA865F7C167D2B0A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C294F478A2974B1197C59883C2AB00B1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5E604507AD734D60A43D5FF44CF4FF0E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: brokersdaygeneresults
          slot-name: Production
          package: app
